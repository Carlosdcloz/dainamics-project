<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEET the Art - Galería Premium</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #ffffff;
            --text-main: #111111;
            --glass-bg: rgba(255, 255, 255, 0.4);
            --glass-border: rgba(255, 255, 255, 0.7);
            --font-display: 'Playfair Display', serif;
            --font-body: 'Inter', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, hsla(0,0%,95%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(0,0%,98%,1) 0, transparent 50%);
            color: var(--text-main);
            font-family: var(--font-body);
            padding-top: 100px; /* Espacio para el navbar flotante */
        }

        /* --- NAVBAR GLASMÓRFICO --- */
        nav {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1000px;
            height: 70px;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 50px; /* Estilo píldora/burbuja */
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            z-index: 2000;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
        }

        .nav-logo {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 1.2rem;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-main);
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.7;
            transition: opacity 0.3s;
        }

        .nav-links a:hover { opacity: 1; }

        /* --- HEADER --- */
        header {
            padding: 60px 20px;
            text-align: center;
        }

        h1 {
            font-family: var(--font-display);
            font-size: clamp(3rem, 10vw, 5.5rem);
            font-weight: 700;
            letter-spacing: -2px;
        }

        h1 span { font-style: italic; color: #999; }

        /* --- GALERÍA ESTILO BURBUJA --- */
        .gallery-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            column-count: 3;
            column-gap: 30px;
        }

        .gallery-item {
            position: relative;
            margin-bottom: 30px;
            break-inside: avoid;
            border-radius: 50px; /* Borde muy redondeado tipo burbuja */
            overflow: hidden;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 4px solid transparent;
            background: var(--glass-bg);
        }

        .gallery-item:hover {
            transform: scale(1.03); /* Efecto rebote suave */
            border-color: var(--glass-border);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .gallery-item img {
            width: 100%;
            display: block;
            border-radius: 46px; /* Un poco menos que el contenedor para encajar */
            transition: filter 0.4s;
        }

        /* Hover Overlay Glasmórfico */
        .overlay {
            position: absolute;
            inset: 15px; /* Separado del borde de la burbuja */
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.4s;
            border: 1px solid rgba(255,255,255,0.4);
            text-align: center;
            padding: 20px;
        }

        .gallery-item:hover .overlay { opacity: 1; }

        .overlay h3 {
            font-family: var(--font-display);
            font-size: 1.4rem;
            color: #111;
            margin-bottom: 5px;
        }

        .overlay p {
            font-size: 0.8rem;
            color: #444;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* --- MODAL REFORZADO --- */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            z-index: 3000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.8);
            width: 100%;
            max-width: 1100px;
            height: 80vh;
            border-radius: 60px; /* Burbuja gigante */
            display: flex;
            overflow: hidden;
            border: 1px solid white;
            box-shadow: 0 30px 60px rgba(0,0,0,0.1);
            position: relative;
        }

        .modal-image-container { flex: 1.2; background: #eee; }
        .modal-image-container img { width: 100%; height: 100%; object-fit: cover; }

        .modal-info-container {
            flex: 1;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .close-btn {
            position: absolute;
            top: 30px;
            right: 40px;
            font-size: 2.5rem;
            cursor: pointer;
            border: none;
            background: none;
        }

        @media (max-width: 900px) {
            .gallery-container { column-count: 2; }
            .modal-content { flex-direction: column; height: 90vh; border-radius: 40px; }
            .modal-image-container { flex: none; height: 40%; }
            nav { width: 95%; }
        }
        @media (max-width: 600px) { .gallery-container { column-count: 1; } }

    </style>
</head>
<body>

       <nav>
        <div class="nav-logo">ART.EXPO</div>
        <ul class="nav-links">
            <li><a href="index.html">Inicio</a></li>
            <li><a href="art.html">Galería</a></li>
            <li><a href="#">Contacto</a></li>
        </ul>
    </nav>

    <header>
        <h1>MEET <span>the</span> Art</h1>
    </header>

    <div class="gallery-container" id="gallery">
        </div>

    <div class="modal" id="artModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <div class="modal-image-container">
                <img src="" alt="" id="modalImg">
            </div>
            <div class="modal-info-container">
                <h2 id="modalTitle" style="font-family: var(--font-display); font-size: 3rem; margin-bottom: 10px;">Título</h2>
                <p id="modalAuthor" style="color: #888; margin-bottom: 20px; font-weight: 600;">Autor</p>
                <p id="modalDesc" style="line-height: 1.6; margin-bottom: 30px;">Descripción...</p>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; font-size: 0.8rem; opacity: 0.6;">
                    <div><strong>Año:</strong> <span id="modalYear">2024</span></div>
                    <div><strong>Técnica:</strong> Digital</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const artworks = [
            { src: "https://images.unsplash.com/photo-1579783902614-a3fb3927b6a5?q=80&w=800", title: "Flora Abstracta", author: "Elena Bloom", year: "2024", desc: "Una pieza que explora las formas orgánicas y el color pastel." },
            { src: "https://images.unsplash.com/photo-1541701494587-cb58502866ab?q=80&w=800", title: "Fluidity", author: "Marco Rossi", year: "2023", desc: "El movimiento del agua capturado en un instante eterno." },
            { src: "https://images.unsplash.com/photo-1549490349-8643362247b5?q=80&w=800", title: "Minimal Sky", author: "Sarah Jenkins", year: "2024", desc: "Menos es más bajo el cielo de California." },
            { src: "https://images.unsplash.com/photo-1501472312651-726afe119ff1?q=80&w=800", title: "Urban Geometry", author: "David Arq", year: "2022", desc: "Líneas rectas que definen el caos de la ciudad." },
            { src: "https://images.unsplash.com/photo-1574169208507-84376144848b?q=80&w=800", title: "Dreamscape", author: "Luna Ray", year: "2024", desc: "Un viaje surrealista a través de capas de luz." },
            { src: "https://images.unsplash.com/photo-1554188248-986adbb73be4?q=80&w=800", title: "Velvet Night", author: "Iker K.", year: "2023", desc: "La profundidad del negro sobre texturas suaves." }
        ];

        const gallery = document.getElementById('gallery');
        const modal = document.getElementById('artModal');

        artworks.forEach((art, i) => {
            const item = document.createElement('div');
            item.className = 'gallery-item';
            item.innerHTML = `
                <img src="${art.src}" alt="${art.title}">
                <div class="overlay">
                    <h3>${art.title}</h3>
                    <p>${art.author}</p>
                </div>
            `;
            item.onclick = () => openModal(i);
            gallery.appendChild(item);
        });

        function openModal(i) {
            const art = artworks[i];
            document.getElementById('modalImg').src = art.src;
            document.getElementById('modalTitle').textContent = art.title;
            document.getElementById('modalAuthor').textContent = `Por ${art.author}`;
            document.getElementById('modalDesc').textContent = art.desc;
            document.getElementById('modalYear').textContent = art.year;
            
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modal.style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        window.onclick = (e) => { if(e.target == modal) closeModal(); }
    </script>
</body>
</html>
